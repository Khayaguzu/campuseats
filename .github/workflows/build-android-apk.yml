name: Build CampusEats Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-android-apk.yml'
      - 'CampusEats_Website_Android_App_Separated/Android_App/**'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: CampusEats_Website_Android_App_Separated/Android_App

    steps:
      - name: Check out CampusEats
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK
        run: |
          # ubuntu-latest already includes the Android SDK and sdkmanager.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build CampusEats debug APK
        run: bash ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK and hosted website configuration
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          grep -Fq 'https://khayaguzu.helioho.st/' \
            app/build/generated/source/buildConfig/debug/za/ac/campuseats/BuildConfig.java

      - name: Upload CampusEats APK
        uses: actions/upload-artifact@v4
        with:
          name: CampusEats-Android-debug-APK
          path: CampusEats_Website_Android_App_Separated/Android_App/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
